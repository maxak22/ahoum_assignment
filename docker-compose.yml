# Full stack comes together over several phases. Right now: db + backend.
# frontend and nginx are added in later phases.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume => Postgres data survives `docker compose down` and
      # container rebuilds. Only `docker compose down -v` wipes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Exposed directly for now so we can curl it. Once nginx is added,
      # this port publish goes away and only nginx is public.
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:

# Config for the nginx INSIDE the frontend container. It only serves the static
# SPA build; the edge nginx (nginx/default.conf) does the API routing + gzip.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html so client-side routing works
    # (e.g. a hard refresh on /sessions/3).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (JS/CSS/fonts) never change — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# Edge reverse proxy. The only container published to the host (port 80).
#
#   /            -> frontend container (static React build)
#   /api/        -> backend  (Django REST API)
#   /admin/      -> backend  (Django admin)
#   /django-static/ -> backend (admin CSS/JS via WhiteNoise)

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain text/css application/javascript application/json
    application/wasm image/svg+xml application/manifest+json;

server {
    listen 80;
    server_name _;

    # room for session descriptions etc.; booking payloads are tiny
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        # lets the Google sign-in popup post its result back to the app
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    }
}
